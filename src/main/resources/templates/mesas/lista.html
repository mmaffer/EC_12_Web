<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mesas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Mesas</h1>
    </div>
    <div class="row g-4">
        <div class="col-md-7">
            <div class="card">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Número</th>
                            <th>Capacidad</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="mesa : ${mesas}">
                            <td th:text="${mesa.numero}">1</td>
                            <td th:text="${mesa.capacidad}">4</td>
                            <td><span class="badge badge-status text-bg-primary" th:text="${mesa.estado}">DISPONIBLE</span></td>
                            <td>
                                <form th:action="@{'/mesas/' + ${mesa.id} + '/estado'}" method="post" class="d-flex gap-2">
                                    <select class="form-select form-select-sm" name="estado">
                                        <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"
                                                th:selected="${mesa.estado == estado}"></option>
                                    </select>
                                    <button class="btn btn-sm btn-outline-primary">OK</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Nueva mesa</h5>
                    <form th:action="@{/mesas}" method="post" th:object="${nuevaMesa}">
                        <div class="mb-3">
                            <label class="form-label">Número</label>
                            <input class="form-control" th:field="*{numero}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Capacidad</label>
                            <input class="form-control" th:field="*{capacidad}" required>
                        </div>
                        <button class="btn btn-primary w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
